<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>IIT Roorkee — Certificate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #080c14;
      --bg-header: rgba(15, 23, 42, 0.75);
      --bg-control: rgba(2, 6, 23, 0.8);
      --border-subtle: rgba(255, 255, 255, 0.1);
      --border-control: rgba(255, 255, 255, 0.15);
      --text-primary: #f8fafc;
      --text-muted: #94a3b8;
      --primary-blue: #2563eb;
      --primary-hover: #1d4ed8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    /* Custom Theme-Matched Dark Scrollbar (Zero performance overhead, GPU accelerated) */
    * {
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.22) #080c14;
    }

    ::-webkit-scrollbar {
      width: 7px;
      height: 7px;
    }

    ::-webkit-scrollbar-track {
      background: #080c14;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 9999px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.35);
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-primary);
    }

    /* Minimal Top Bar */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 52px;
      background: var(--bg-header);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      z-index: 100;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-title {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: -0.01em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dot-separator {
      color: var(--border-control);
      font-size: 12px;
    }

    .header-subtitle {
      font-size: 12.5px;
      color: var(--text-muted);
      font-weight: 400;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-download-icon {
      width: 38px;
      height: 38px;
      border-radius: 9999px;
      background: var(--bg-control);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-control);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.18s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .btn-download-icon:hover {
      background: rgba(30, 41, 59, 0.95);
      border-color: rgba(255, 255, 255, 0.35);
      color: #38bdf8;
      transform: scale(1.08);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5), 0 0 12px rgba(56, 189, 248, 0.25);
    }

    .btn-download-icon:active {
      transform: scale(0.92);
    }

    /* Document Viewport (LeaveDesk Pattern) */
    .viewport {
      position: absolute;
      top: 52px;
      bottom: 0;
      left: 0;
      right: 0;
      overflow: auto;
      overscroll-behavior: contain;
      cursor: default;
      display: flex;
      flex-direction: column;
      align-items: center;
      scrollbar-gutter: stable;
      -webkit-overflow-scrolling: touch;
      background: radial-gradient(circle at center 20%, #111827 0%, #06090e 100%);
    }

    .scroll-inner {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100%;
      min-width: 100%;
      width: max-content;
      padding: 20px 16px 80px 16px;
    }

    .doc-wrapper {
      position: relative;
      cursor: grab;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      transition: width 0.1s ease-out;
    }

    .doc-wrapper.is-dragging {
      cursor: grabbing;
    }

    .cert-img {
      display: block;
      margin: 0 auto;
      height: auto;
      width: 100%;
      max-width: none;
      border-radius: 4px;
      background-color: #ffffff;
      box-shadow: 0 0 50px -10px rgba(0, 0, 0, 0.7), 0 20px 40px -15px rgba(0, 0, 0, 0.6);
    }

    /* Floating HUD Controls (LeaveDesk Pattern) */
    .floating-hud {
      pointer-events: none;
      position: fixed;
      inset: 0;
      z-index: 150;
    }

    .hud-btn {
      pointer-events: auto;
      border-radius: 9999px;
      background: var(--bg-control);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-control);
      box-shadow: 0 12px 25px -4px rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      cursor: pointer;
      transition: all 0.15s ease;
      outline: none;
      font-family: inherit;
    }

    .hud-btn:hover:not(:disabled) {
      background: rgba(30, 41, 59, 0.9);
      transform: scale(1.06);
      border-color: rgba(255, 255, 255, 0.35);
    }

    .hud-btn:active:not(:disabled) {
      transform: scale(0.95);
    }

    .hud-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    /* Bottom Left: Zoom Controls */
    .bottom-left {
      position: absolute;
      bottom: 20px;
      left: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-icon {
      width: 42px;
      height: 42px;
    }

    .btn-fit {
      height: 42px;
      padding: 0 14px;
      font-size: 12px;
      font-weight: 600;
    }

    /* Bottom Right: Scroll & Fullscreen */
    .bottom-right {
      position: absolute;
      bottom: 20px;
      right: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    @media (max-width: 600px) {
      .bottom-left {
        left: 12px;
        bottom: 16px;
        gap: 6px;
      }
      .btn-icon {
        width: 38px;
        height: 38px;
      }
      .btn-fit {
        height: 38px;
        padding: 0 10px;
        font-size: 11px;
      }
      .bottom-right {
        right: 12px;
        bottom: 16px;
        gap: 6px;
      }
    }
  </style>
</head>
<body>

  <!-- Minimal Top Bar -->
  <header>
    <div class="header-left">
      <span class="header-title">IIT Roorkee</span>
      <span class="dot-separator">&bull;</span>
      <span class="header-subtitle">Internship Certificate</span>
    </div>
    <div class="header-right">
      <a class="btn-download-icon" href="https://github.com/The-AnkitPatel/Certificate/raw/main/IITR-Internship.pdf" download="Ankit_Kumar_Patel_IIT_Roorkee_Certificate.pdf" title="Download Certificate (PDF)" aria-label="Download Certificate (PDF)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
      </a>
    </div>
  </header>

  <!-- Document Viewport -->
  <main class="viewport" id="viewport">
    <div class="scroll-inner" id="scrollInner">
      <div class="doc-wrapper" id="docWrapper">
        <img
          src="../certificate_preview.png"
          alt="IIT Roorkee Internship Certificate — Ankit Kumar Patel"
          class="cert-img"
          id="certImg"
          draggable="false"
        />
      </div>
    </div>
  </main>

  <!-- Floating HUD Controls -->
  <div class="floating-hud">
    
    <!-- Bottom Left: Zoom Controls -->
    <div class="bottom-left">
      <button type="button" class="hud-btn btn-icon" id="btnZoomOut" aria-label="Zoom Out" title="Zoom Out">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg>
      </button>
      <button type="button" class="hud-btn btn-icon" id="btnZoomIn" aria-label="Zoom In" title="Zoom In">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="11" y1="8" x2="11" y2="14"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg>
      </button>
      <button type="button" class="hud-btn btn-fit" id="btnFit" title="Fit to Screen">
        Fit
      </button>
    </div>

    <!-- Bottom Right: Scroll & Fullscreen -->
    <div class="bottom-right">
      <button type="button" class="hud-btn btn-icon" id="btnScroll" aria-label="Scroll Toggle" title="Scroll">
        <svg id="iconDown" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
        <svg id="iconUp" style="display: none;" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"></polyline></svg>
      </button>
      <button type="button" class="hud-btn btn-icon" id="btnFullscreen" aria-label="Fullscreen" title="Fullscreen">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
      </button>
    </div>

  </div>

  <script>
    // Constants matching LeaveDesk
    const MIN_ZOOM = 0.65;
    const MAX_ZOOM = 3.2;
    const ZOOM_STEP = 0.2;
    let currentZoom = 1.0;

    const viewport = document.getElementById('viewport');
    const docWrapper = document.getElementById('docWrapper');
    const btnZoomIn = document.getElementById('btnZoomIn');
    const btnZoomOut = document.getElementById('btnZoomOut');
    const btnFit = document.getElementById('btnFit');
    const btnScroll = document.getElementById('btnScroll');
    const iconDown = document.getElementById('iconDown');
    const iconUp = document.getElementById('iconUp');
    const btnFullscreen = document.getElementById('btnFullscreen');

    function clampZoom(val) {
      return Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, Number(val.toFixed(2))));
    }

    function applyZoom(zoom) {
      currentZoom = clampZoom(zoom);
      docWrapper.style.width = `min(${72 * currentZoom}rem, ${92 * currentZoom}vw)`;
      
      btnZoomOut.disabled = currentZoom <= MIN_ZOOM;
      btnZoomIn.disabled = currentZoom >= MAX_ZOOM;
      updateScrollButtonState();
    }

    // LeaveDesk pan/drag implementation with pointer capture
    let isPanning = false;
    let startX = 0;
    let startY = 0;
    let scrollStartX = 0;
    let scrollStartY = 0;

    docWrapper.addEventListener('pointerdown', (e) => {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      isPanning = true;
      startX = e.clientX;
      startY = e.clientY;
      scrollStartX = viewport.scrollLeft;
      scrollStartY = viewport.scrollTop;
      docWrapper.classList.add('is-dragging');
      docWrapper.setPointerCapture(e.pointerId);
    });

    docWrapper.addEventListener('pointermove', (e) => {
      if (!isPanning) return;
      e.preventDefault();
      viewport.scrollLeft = scrollStartX - (e.clientX - startX);
      viewport.scrollTop = scrollStartY - (e.clientY - startY);
    });

    const stopPan = (e) => {
      if (!isPanning) return;
      isPanning = false;
      docWrapper.classList.remove('is-dragging');
      try {
        docWrapper.releasePointerCapture(e.pointerId);
      } catch (_) {}
    };

    docWrapper.addEventListener('pointerup', stopPan);
    docWrapper.addEventListener('pointercancel', stopPan);

    // Touch Pinch-to-Zoom (LeaveDesk Multi-touch)
    let initialPinchDist = null;
    let initialPinchZoom = 1.0;

    viewport.addEventListener('touchstart', (e) => {
      if (e.touches.length === 2) {
        initialPinchDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        initialPinchZoom = currentZoom;
      }
    }, { passive: true });

    viewport.addEventListener('touchmove', (e) => {
      if (e.touches.length === 2 && initialPinchDist) {
        e.preventDefault();
        const dist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        applyZoom(initialPinchZoom * (dist / initialPinchDist));
      }
    }, { passive: false });

    viewport.addEventListener('touchend', (e) => {
      if (e.touches.length < 2) {
        initialPinchDist = null;
      }
    });

    // Mouse Wheel Zoom (Ctrl/Cmd + Wheel)
    viewport.addEventListener('wheel', (e) => {
      if (e.ctrlKey || e.metaKey) {
        e.preventDefault();
        applyZoom(currentZoom + (e.deltaY < 0 ? ZOOM_STEP : -ZOOM_STEP));
      }
    }, { passive: false });

    // Double-click to toggle zoom
    docWrapper.addEventListener('dblclick', (e) => {
      e.preventDefault();
      applyZoom(currentZoom > 1.1 ? 1.0 : 1.4);
    });

    // Button controls
    btnZoomIn.addEventListener('click', () => applyZoom(currentZoom + ZOOM_STEP));
    btnZoomOut.addEventListener('click', () => applyZoom(currentZoom - ZOOM_STEP));
    btnFit.addEventListener('click', () => applyZoom(1.0));

    function updateScrollButtonState() {
      const maxScroll = Math.max(0, viewport.scrollHeight - viewport.clientHeight);
      const isBottom = maxScroll > 0 && viewport.scrollTop >= maxScroll - 40;
      if (isBottom) {
        iconDown.style.display = 'none';
        iconUp.style.display = 'block';
      } else {
        iconDown.style.display = 'block';
        iconUp.style.display = 'none';
      }
    }

    btnScroll.addEventListener('click', () => {
      const maxScroll = Math.max(0, viewport.scrollHeight - viewport.clientHeight);
      const isBottom = maxScroll > 0 && viewport.scrollTop >= maxScroll - 40;
      viewport.scrollTo({
        top: isBottom ? 0 : viewport.scrollTop + Math.max(viewport.clientHeight * 0.8, 300),
        behavior: 'smooth'
      });
    });

    viewport.addEventListener('scroll', updateScrollButtonState, { passive: true });

    btnFullscreen.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    });

    // Initial setup
    applyZoom(1.0);
  </script>
</body>
</html>
